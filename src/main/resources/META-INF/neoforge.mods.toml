modLoader = "javafml"
loaderVersion = "*"
license = "MIT"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "Starcatcher"
description = '''
${description}
'''
logoFile = "assets/${id}/icon.png"
logoBlur = false

[[mixins]]
config="${id}.mixins.json"

[[dependencies.${id}]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraftVersionVirtual},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId="architectury"
type="required"
versionRange="[13,)"
ordering="NONE"
side="BOTH"
